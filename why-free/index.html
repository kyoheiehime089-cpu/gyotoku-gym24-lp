<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="行徳ジム24のLPから、なぜ無料で使えるようにしたのかの部分だけを表示します。"
    />
    <title>なぜ行徳ジム24を無料にしたのか</title>
    <link rel="stylesheet" href="../free-lp/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow-x: hidden;
        background: #eef4f7;
      }

      body {
        padding: 0;
      }

      #section-root {
        min-height: 100vh;
      }

      #section-root > .section--owner {
        margin: 0;
      }

      #section-root .owner__portrait {
        overflow: visible !important;
      }

      #section-root .owner__portrait img {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        max-height: none !important;
        object-fit: contain !important;
        object-position: center !important;
        margin: 0 auto !important;
      }

      .loading,
      .error {
        width: min(720px, calc(100% - 32px));
        margin: 48px auto;
        padding: 24px;
        background: #fff;
        border-radius: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        line-height: 1.8;
        color: #163143;
      }
    </style>
  </head>
  <body>
    <main id="section-root" aria-live="polite">
      <p class="loading">読み込み中です。</p>
    </main>

    <script>
      (async () => {
        const root = document.getElementById("section-root");
        const sourceUrl = "../free-lp/index.html";

        try {
          const response = await fetch(sourceUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`LPを取得できませんでした: ${response.status}`);
          }

          const html = await response.text();
          const sourceDocument = new DOMParser().parseFromString(html, "text/html");
          const section = sourceDocument.querySelector("#why-free");

          if (!section) {
            throw new Error("対象セクションが見つかりませんでした。");
          }

          sourceDocument.querySelectorAll("style").forEach((style) => {
            document.head.appendChild(style.cloneNode(true));
          });

          const extractedSection = section.cloneNode(true);

          extractedSection.querySelectorAll("img").forEach((image) => {
            const src = image.getAttribute("src");
            if (src && src.includes("owner-kyohei.png")) {
              image.setAttribute("src", "../free-lp/assets/images/owner-kyohei.png?v=3");
              return;
            }
            if (src && !src.startsWith("http") && !src.startsWith("/")) {
              image.setAttribute("src", new URL(src, new URL(sourceUrl, location.href)).href);
            }

            const srcset = image.getAttribute("srcset");
            if (srcset) {
              const resolved = srcset
                .split(",")
                .map((entry) => {
                  const parts = entry.trim().split(/\s+/);
                  const url = parts.shift();
                  if (!url) return entry;
                  const absolute = url.startsWith("http") || url.startsWith("/")
                    ? url
                    : new URL(url, new URL(sourceUrl, location.href)).href;
                  return [absolute, ...parts].join(" ");
                })
                .join(", ");
              image.setAttribute("srcset", resolved);
            }
          });

          extractedSection.querySelectorAll("source").forEach((source) => {
            const srcset = source.getAttribute("srcset");
            if (!srcset) return;
            const resolved = srcset
              .split(",")
              .map((entry) => {
                const parts = entry.trim().split(/\s+/);
                const url = parts.shift();
                if (!url) return entry;
                const absolute = url.startsWith("http") || url.startsWith("/")
                  ? url
                  : new URL(url, new URL(sourceUrl, location.href)).href;
                return [absolute, ...parts].join(" ");
              })
              .join(", ");
            source.setAttribute("srcset", resolved);
          });

          root.replaceChildren(extractedSection);
        } catch (error) {
          console.error(error);
          root.innerHTML =
            '<p class="error">ページを読み込めませんでした。少し時間をおいて、もう一度開いてください。</p>';
        }
      })();
    </script>
  </body>
</html>
